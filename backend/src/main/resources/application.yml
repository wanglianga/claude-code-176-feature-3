server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:Y291bnR5LXZpc2lvbi1zY3JlZW5pbmctcGxhdGZvcm0tZGVtby1zZWNyZXQta2V5LTEyMw==}
    expire-hours: 12

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vision:
  # 本地默认不依赖 Redis；postgres profile 下自动启用
  redis:
    enabled: ${VISION_REDIS_ENABLED:false}
  seed:
    enabled: ${VISION_SEED_ENABLED:true}
  # 县域配镜补助标准：单副眼镜补助上限（元），发放核验收紧在该标准内；可由环境变量覆盖
  subsidy:
    cap: ${VISION_SUBSIDY_CAP:300}
